<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V18-3 · Aanwezigheid</title>
<style>
  :root{
    --black:#1a1a1a;
    --panel:#242224;
    --line:#38363a;
    --paper:#f5f3f0;
    --text:#f5f3f0;
    --ink:#221a14;
    --red:#c0001f;
    --red-dim:#7a0e1f;
    --muted:#a7a3a6;
    --ok:#3f8f52;
  }
  body.light{
    --black:#f3f1ec;
    --panel:#ffffff;
    --line:#ddd7cd;
    --text:#221a14;
    --muted:#6b645d;
  }
  body{transition:background 0.2s, color 0.2s;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height:100vh;
    padding: 0 0 60px;
  }
  .overname-toggle-btn{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid #E30A17;
    border-left:4px solid #E30A17;
    border-radius:4px;
    padding:10px 14px;
    margin-bottom:14px;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:0.95rem;
    color:#E30A17;
    cursor:pointer;
  }
  .overname-section{
    background:#fff;
    border:1px solid #E30A17;
    border-left:4px solid #E30A17;
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .overname-titel{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:1rem;
    color:#E30A17;
    margin-bottom:4px;
  }
  .overname-uitleg{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.85rem;
    color:#5a5a5a;
    margin-bottom:10px;
  }
  #overnameNaamInput{
    width:100%;
    padding:10px 12px;
    margin-bottom:10px;
    font-size:1.1rem;
    font-family:'Georgia', serif;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
  }
  .overname-event{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid #E30A17;
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .overname-event:last-child{margin-bottom:0;}
  .overname-event-head{
    display:flex;
    flex-direction:column;
    margin-bottom:8px;
  }
  .overname-event-head strong{font-size:1.05rem;}
  .overname-event-head span{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.85rem;
    color:var(--muted);
  }

  .wrap{max-width:700px;margin:0 auto;padding:0 16px;}

  header{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 14px 8px;
    margin-bottom: 10px;
    border-bottom: 3px solid var(--red);
  }
  header img{
    width:36px;
    height:auto;
    flex-shrink:0;
  }
  #themeToggle{
    margin-left:auto;
    flex-shrink:0;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.85rem;
    font-weight:bold;
    padding:7px 14px;
    border-radius:12px;
    border:1px solid var(--red);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  header h1{
    font-family: 'Futura', 'Trebuchet MS', sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    font-size:1.4rem;
    margin:0;
    color:var(--text);
  }
  header h1 span{color:var(--red);}
  header .sub{
    font-family: 'Trebuchet MS', sans-serif;
    font-size:0.85rem;
    color:var(--muted);
  }

  .whoami{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .whoami label{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.95rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .whoami input, .whoami select{
    flex:1;
    width:100%;
    padding:10px 12px;
    font-size:1.15rem;
    font-family: 'Georgia', serif;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
  }
  #nieuweNaamInput{margin-top:0 !important;}

  .event{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--muted);
    border-radius:4px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .event.wedstrijd{border-left-color:var(--red);}
  .event-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
    gap:8px;
  }
  .event-head .type{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.8rem;
    letter-spacing:0.3px;
    color:var(--muted);
  }
  .event.wedstrijd .event-head .type{color:var(--red);}
  .event-head h2{
    margin:0;
    font-size:1.25rem;
    font-weight:normal;
    overflow-wrap:break-word;
  }
  .event-head .titel-blok{
    flex:1 1 auto;
    min-width:0;
  }
  .event-head .teller{
    margin-left:6px;
    vertical-align:middle;
  }
  .event-head .datum{
    flex:0 0 auto;
    max-width:50%;
    font-family:'Trebuchet MS', sans-serif;
    text-align:right;
    line-height:1.3;
  }
  .event-head .datum .dag{
    display:block;
    font-size:1.25rem;
    font-weight:bold;
    color:var(--text);
  }
  .event-head .datum .details{
    display:block;
    font-size:0.85rem;
    color:var(--muted);
  }

  .teller{
    display:inline-block;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.8rem;
    font-weight:bold;
    color:#fff;
    background:#57545c;
    border-radius:10px;
    padding:2px 10px;
  }
  .event.wedstrijd .teller{background:var(--red-dim);color:#fff;}
  .nav-link{color:var(--red);font-weight:bold;text-decoration:underline;}

  .toggle{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .toggle button{
    flex:1;
    padding:10px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:1rem;
    border-radius:3px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  .toggle button.komt.active{background:var(--ok);border-color:var(--ok);color:#fff;}
  .toggle button.niet.active{background:var(--red);border-color:var(--red);color:#fff;}
  .toggle button:disabled{opacity:0.4;cursor:default;}

  .vandaag-badge{
    display:inline-block;
    background:var(--red);
    color:#fff;
    font-size:0.75rem;
    font-weight:bold;
    letter-spacing:0.5px;
    padding:2px 8px;
    border-radius:8px;
    vertical-align:middle;
  }
  .tafel-blok{
    background:rgba(192,0,31,0.12);
    border:1px solid var(--red);
    border-radius:4px;
    padding:8px 12px;
    margin-bottom:10px;
    font-size:1rem;
    color:var(--text);
  }

  .reden-input{
    width:100%;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:0.95rem;
    font-family:'Trebuchet MS', sans-serif;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
  }

  .nog-niet{
    color:var(--muted);
    font-style:italic;
  }

  .opp-logo{
    height:1.3em;
    width:auto;
    vertical-align:middle;
    margin-right:6px;
    border-radius:3px;
  }

  .qr-btn{
    display:block;
    width:100%;
    padding:10px;
    margin-bottom:8px;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:1rem;
    background:var(--panel);
    border:1px solid var(--red);
    color:var(--red);
    border-radius:4px;
    cursor:pointer;
  }
  .qr-overlay{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.75);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .qr-overlay-inner{
    background:#fff;
    border-radius:8px;
    padding:20px;
    text-align:center;
    max-width:340px;
    width:100%;
  }
  .qr-overlay-titel{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:1.1rem;
    color:#1a1a1a;
    margin-bottom:12px;
  }
  .qr-overlay-inner img{
    width:100%;
    max-width:280px;
    height:auto;
    margin-bottom:16px;
  }
  .qr-overlay-inner button{
    padding:10px 20px;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:0.95rem;
    background:#c0001f;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }

  .lijst{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.95rem;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:8px;
    line-height:1.5;
  }
  .lijst .naam{color:var(--text);}
  .lijst .naam.niet{color:var(--muted);text-decoration:line-through;}

  .status{
    text-align:center;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.9rem;
    color:var(--muted);
    margin-top:14px;
    min-height:1.2em;
  }

  .share{
    background:var(--panel);
    border:1px dashed var(--red);
    border-radius:4px;
    padding:10px;
    margin-bottom:10px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.9rem;
  }
  .share a{color:var(--red);word-break:break-all;}
</style>
</head>

function fmtOvernameDatum(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return dagNamen[d.getDay()] + " " + d.getDate() + " " + maandNamen[d.getMonth()];
}

let overnameOpen = false;

function renderOvername(){
  const toggleBtn = document.getElementById('overnameToggle');
  const sectionEl = document.getElementById('overnameSection');
  const blokEl = document.getElementById('overnameBlok');
  if(!toggleBtn || !sectionEl || !blokEl) return;
  const vandaagIso = iso(vandaag);
  if(vandaagIso > OVERNAME_TOT){
    toggleBtn.style.display = "none";
    sectionEl.style.display = "none";
    return;
  }
  toggleBtn.style.display = "block";
  sectionEl.style.display = overnameOpen ? "block" : "none";
  if(!overnameOpen) return;

  const naam = overnameNaamInput.value.trim();

  blokEl.innerHTML = OVERNAME_EVENTS.map(ev=>{
    const reacties = data.overname[ev.key] || {};
    const kan = Object.entries(reacties).filter(([n,v])=>v===true).map(([n])=>n);
    const kanNiet = Object.entries(reacties).filter(([n,v])=>v===false).map(([n])=>n);
    const actief = naam && reacties[naam];
    const actiefJa = actief === true;
    const actiefNee = actief === false;
    return `
      <div class="overname-event">
        <div class="overname-event-head">
          <strong>${ev.label}</strong>
          <span>${fmtOvernameDatum(ev.datum)} · ${ev.tijd} · ${ev.locatie}</span>
        </div>
        <div class="toggle">
          <button class="komt ${actiefJa?'active':''}" ${!naam?'disabled':''} data-overkey="${ev.key}" data-overval="true">Ik kan overnemen</button>
          <button class="niet ${actiefNee?'active':''}" ${!naam?'disabled':''} data-overkey="${ev.key}" data-overval="false">Ik kan niet</button>
        </div>
        <div class="lijst">
          ${kan.length ? "Kan: " + kan.map(n=>`<span class="naam">${n}</span>`).join(", ") : "Nog niemand die kan."}
          ${kanNiet.length ? "<br>Kan niet: " + kanNiet.map(n=>`<span class="naam niet">${n}</span>`).join(", ") : ""}
        </div>
      </div>
    `;
  }).join("");

  blokEl.querySelectorAll('.toggle button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const huidigeNaam = overnameNaamInput.value.trim();
      if(!huidigeNaam) return;
      const key = btn.dataset.overkey;
      const val = btn.dataset.overval === "true";
      if(!data.overname[key]) data.overname[key] = {};
      data.overname[key][huidigeNaam] = val;
      setStatus("Opslaan…");
      renderOvername();
      try{
        await saveBlob();
        setStatus("Opgeslagen ✓");
      }catch(e){
        setStatus("Opslaan mislukt: " + e.message);
      }
    });
  });
}

async function loadBlob(id){
  const res = await fetch(DB_URL + "/aanwezigheid/" + id + ".json");
  if(!res.ok) throw new Error("niet gevonden: status " + res.status);
  const json = await res.json();
  return json || { children: [], attendance: {}, redenen: {}, overname: {} };
}

async function saveBlob(){
  const res = await fetch(DB_URL + "/aanwezigheid/" + blobId + ".json", {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  if(!res.ok){
    let tekst = "";
    try{ tekst = await res.text(); }catch(e){}
    throw new Error("status " + res.status + " " + tekst);
  }
}

    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    childInput.appendChild(opt);
  });

  const optNieuw = document.createElement('option');
  optNieuw.value = "__nieuw__";
  optNieuw.textContent = "+ Andere naam toevoegen";
  childInput.appendChild(optNieuw);

  if ([...childInput.options].some(o => o.value === huidige)) {
    childInput.value = huidige;
  }
}

function getCurrentChild(){
  if (childInput.value === "__nieuw__") return nieuweNaamInput.value.trim();
  return childInput.value;
}

function renderEvents(){
  eventsEl.innerHTML = "";
  const currentChild = getCurrentChild();

  const vandaagIso = iso(vandaag);

  events.forEach(ev=>{
    const box = document.createElement('div');
    box.className = "event" + (ev.type === "wedstrijd" ? " wedstrijd" : "");

    const att = data.attendance[ev.key] || {};
    const redenen = (data.redenen && data.redenen[ev.key]) || {};

    const nietActive = currentChild && att[currentChild] === false;
    const isVandaag = ev.key === vandaagIso;

    const afmelders = Object.entries(att).filter(([n,v])=>v===false).map(([n])=>n);
    const komers = data.children.filter(n => !afmelders.includes(n));
    const icoon = ev.type === "wedstrijd" ? "🎽" : "🏀";

    box.innerHTML = `
      <div class="event-head">
        <div class="titel-blok">
          <div class="type">${icoon} ${ev.type === "wedstrijd" ? "Wedstrijd" : "Training"}${isVandaag ? ' <span class="vandaag-badge">VANDAAG</span>' : ''}</div>
          <h2>${ev.logo ? `<img src="${ev.logo}" class="opp-logo" alt="">` : ''}${ev.label}<span class="teller">✓ ${komers.length} · ✗ ${afmelders.length}</span></h2>
        </div>
        <div class="datum">
          <span class="dag">${fmt(ev.datum)}</span>
          <span class="details">${ev.tijd ? ev.tijd : ""}${ev.locatie ? (ev.tijd ? " · " : "") + ev.locatie : ""}${ev.mapsUrl ? ` · <a class="nav-link" href="${ev.mapsUrl}" target="_blank" rel="noopener">Navigeer</a>` : ""}</span>
        </div>
      </div>
      <div class="toggle">
        <button class="niet ${nietActive?'active':''}" ${!currentChild?'disabled':''} data-key="${ev.key}">${nietActive ? 'Toch komen' : 'Ik kan niet komen'}</button>
      </div>
      ${ev.tafel ? `<div class="tafel-blok">🗓️ Tafelen: ${ev.tafel.map(n=>"Ouder van "+n).join(" & ")}</div>` : ''}
      ${ev.toegangQr ? `<button class="qr-btn" data-qr="1">🔳 Toegang QR</button>` : ''}
      ${nietActive ? `<input class="reden-input" data-key="${ev.key}" placeholder="Reden (optioneel): ziek, blessure, vakantie…" value="${redenen[currentChild] ? redenen[currentChild].replace(/"/g,'&quot;') : ''}">` : ''}
      <div class="lijst">
        ${komers.length ? "Komen: " + komers.map(n=>`<span class="naam">${n}</span>`).join(", ") : "Nog niemand aangemeld."}
        ${afmelders.length ? "<br>Afgemeld: " + afmelders.map(n=>`<span class="naam niet">${n}${redenen[n] ? " ("+redenen[n]+")" : ""}</span>`).join(", ") : ""}
      </div>
    `;

    box.querySelectorAll('.toggle button').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!currentChild) return;
        const key = btn.dataset.key;
        if(!data.attendance[key]) data.attendance[key] = {};
        const huidig = data.attendance[key][currentChild];
        if(huidig === false){
          delete data.attendance[key][currentChild];
          if(data.redenen[key]) delete data.redenen[key][currentChild];
        } else {
          data.attendance[key][currentChild] = false;
        }
        if(!data.children.includes(currentChild)){
          data.children.push(currentChild);
          renderChildNames();
        }
        setStatus("Opslaan…");
        renderEvents();
        try{
          await saveBlob();
          setStatus("Opgeslagen ✓");
        }catch(e){
          setStatus("Opslaan mislukt: " + e.message);
        }
      });
    });

    const redenInput = box.querySelector('.reden-input');
    if(redenInput){
      redenInput.addEventListener('change', async ()=>{
        const key = redenInput.dataset.key;
        if(!currentChild) return;
        if(!data.redenen[key]) data.redenen[key] = {};
        const tekst = redenInput.value.trim();
        if(tekst){ data.redenen[key][currentChild] = tekst; }
        else { delete data.redenen[key][currentChild]; }
        setStatus("Opslaan…");
        renderEvents();
        try{
          await saveBlob();
          setStatus("Opgeslagen ✓");
        }catch(e){
          setStatus("Opslaan mislukt: " + e.message);
        }
      });
    }

    const qrBtn = box.querySelector('.qr-btn');
    if(qrBtn){
      qrBtn.addEventListener('click', ()=>{
        document.getElementById('qrOverlayImg').src = TOEGANG_QR;
        document.getElementById('qrOverlay').style.display = "flex";
      });
    }

    eventsEl.appendChild(box);
  });
}

childInput.addEventListener('change', ()=>{
  nieuweNaamInput.style.display = childInput.value === "__nieuw__" ? "block" : "none";
  if (childInput.value === "__nieuw__") nieuweNaamInput.focus();
  renderEvents();
});
nieuweNaamInput.addEventListener('input', renderEvents);

function vulOvernameNamen(){
  const huidig = overnameNaamInput.value;
  const opties = [...VASTE_NAMEN.map(n => "Ouder van " + n), "Marko"];
  overnameNaamInput.innerHTML = '<option value="">Kies wie je bent…</option>' +
    opties.map(o => `<option value="${o}">${o}</option>`).join("");
  if(opties.includes(huidig)) overnameNaamInput.value = huidig;
}
vulOvernameNamen();
overnameNaamInput.value = localStorage.getItem('overnameNaam') || "";

overnameNaamInput.addEventListener('change', ()=>{
  localStorage.setItem('overnameNaam', overnameNaamInput.value);
  renderOvername();
});

document.getElementById('overnameToggle').addEventListener('click', ()=>{
  overnameOpen = !overnameOpen;
  renderOvername();
});

document.getElementById('qrOverlayClose').addEventListener('click', ()=>{
  document.getElementById('qrOverlay').style.display = "none";
});
document.getElementById('qrOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'qrOverlay') document.getElementById('qrOverlay').style.display = "none";
});

async function init(){
  data.children = [...VASTE_NAMEN];
  try{
    setStatus("Laden…");
    const geladen = await loadBlob(blobId);
    if(!geladen.attendance) geladen.attendance = {};
    if(!geladen.redenen) geladen.redenen = {};
    if(!geladen.overname) geladen.overname = {};
    data.attendance = geladen.attendance;
    data.redenen = geladen.redenen;
    data.overname = geladen.overname;
    data.children = Array.from(new Set([...VASTE_NAMEN, ...(geladen.children||[])]));
    setStatus("");
  }catch(e){
    setStatus("Niet verbonden met de gedeelde lijst (" + e.message + "). Je kunt wel lokaal aanvinken.");
  }
  renderChildNames();
  renderEvents();
  renderOvername();
}

const themeToggle = document.getElementById('themeToggle');
function applyTheme(mode){
  document.body.classList.toggle('light', mode === 'light');
  themeToggle.textContent = mode === 'light' ? 'Light' : 'Dark';
}
let huidigThema = localStorage.getItem('theme') || 'dark';
applyTheme(huidigThema);
themeToggle.addEventListener('click', () => {
  huidigThema = huidigThema === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', huidigThema);
  applyTheme(huidigThema);
});

init();
</script>
</body>
</html>
