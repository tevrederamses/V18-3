<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V18-3 · Aanwezigheid</title>
<style>
  :root{
    --black:#1a1a1a;
    --panel:#242224;
    --line:#38363a;
    --paper:#f5f3f0;
    --ink:#221a14;
    --red:#c0001f;
    --red-dim:#7a0e1f;
    --muted:#a7a3a6;
    --ok:#3f8f52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--paper);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height:100vh;
    padding: 0 0 60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 14px;}

  header{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 14px 8px;
    margin-bottom: 10px;
    border-bottom: 3px solid var(--red);
  }
  header img{
    width:36px;
    height:auto;
    flex-shrink:0;
  }
  header h1{
    font-family: 'Futura', 'Trebuchet MS', sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    font-size:1.1rem;
    margin:0;
    color:var(--paper);
  }
  header h1 span{color:var(--red);}
  header .sub{
    font-family: 'Trebuchet MS', sans-serif;
    font-size:0.68rem;
    color:var(--muted);
  }

  .whoami{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .whoami label{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.72rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .whoami input, .whoami select{
    flex:1;
    width:100%;
    padding:6px 8px;
    font-size:0.9rem;
    font-family: 'Georgia', serif;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
  }
  #nieuweNaamInput{margin-top:0 !important;}

  .event{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--muted);
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .event.wedstrijd{border-left-color:var(--red);}
  .event-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:6px;
  }
  .event-head .type{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.65rem;
    letter-spacing:0.3px;
    color:var(--muted);
  }
  .event.wedstrijd .event-head .type{color:var(--red);}
  .event-head h2{
    margin:0;
    font-size:0.95rem;
    font-weight:normal;
    display:inline;
  }
  .event-head .titel-rij{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .event-head .datum{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.72rem;
    color:var(--muted);
    text-align:right;
    line-height:1.3;
  }

  .teller{
    display:inline-block;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.65rem;
    font-weight:bold;
    color:var(--paper);
    background:var(--line);
    border-radius:10px;
    padding:1px 8px;
  }
  .event.wedstrijd .teller{background:var(--red-dim);}

  .toggle{
    display:flex;
    gap:6px;
    margin-bottom:6px;
  }
  .toggle button{
    flex:1;
    padding:6px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.8rem;
    border-radius:3px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
  }
  .toggle button.komt.active{background:var(--ok);border-color:var(--ok);color:#fff;}
  .toggle button.niet.active{background:var(--red);border-color:var(--red);color:#fff;}
  .toggle button:disabled{opacity:0.4;cursor:default;}

  .lijst{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.72rem;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:5px;
    line-height:1.4;
  }
  .lijst .naam{color:var(--paper);}
  .lijst .naam.niet{color:var(--muted);text-decoration:line-through;}

  .status{
    text-align:center;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.75rem;
    color:var(--muted);
    margin-top:10px;
    min-height:1.2em;
  }

  .share{
    background:var(--panel);
    border:1px dashed var(--red);
    border-radius:4px;
    padding:10px;
    margin-bottom:10px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.75rem;
  }
  .share a{color:var(--red);word-break:break-all;}
</style>
</head>

<script>
const BLOB_API = "https://jsonblob.com/api/jsonBlob";
const params = new URLSearchParams(location.search);
let blobId = params.get("poll");

const dagNamen = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const maandNamen = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

function volgendeDag(vanaf, doelDag){
  const d = new Date(vanaf);
  const diff = (doelDag - d.getDay() + 7) % 7 || 7;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function fmt(d){
  return dagNamen[d.getDay()].replace(/^./, c=>c.toUpperCase()) + " " + d.getDate() + " " + maandNamen[d.getMonth()];
}
function iso(d){ return d.toISOString().slice(0,10); }

const vandaag = new Date();
vandaag.setHours(0,0,0,0);

// Competitieschema V18-3, seizoen 2026-2027 (bron: basketball.nl)
const wedstrijdSchema = [
  { date:"2026-09-12", time:"14:45", opponent:"CobraNova",       home:false, location:"Forum Kwadraat" },
  { date:"2026-09-19", time:"14:15", opponent:"Waterdragers",    home:true,  location:"Goudsmithal" },
  { date:"2026-10-03", time:"14:45", opponent:"DAS",             home:true,  location:"Goudsmithal" },
  { date:"2026-10-10", time:"14:30", opponent:"Zoebas",          home:false, location:"Noordhove" },
  { date:"2026-11-14", time:"17:30", opponent:"Forwodians",      home:false, location:"De Schans" },
  { date:"2026-11-21", time:"14:45", opponent:"BV Oegstgeest",   home:true,  location:"Goudsmithal" },
  { date:"2026-11-28", time:"13:00", opponent:"BV Hoofddorp",    home:false, location:"Sportcomplex Koning Willem-Alexander" },
  { date:"2026-12-06", time:"11:00", opponent:"BV Leiderdorp",   home:true,  location:"Goudsmithal" },
  { date:"2026-12-12", time:"14:45", opponent:"NIEUW Generatie", home:true,  location:"Goudsmithal" },
];

function volgendeWedstrijd(){
  const vandaagIso = iso(vandaag);
  return wedstrijdSchema.find(w => w.date >= vandaagIso) || null;
}

const eerstvolgendeWedstrijd = volgendeWedstrijd();

const events = [
  { key: iso(volgendeDag(vandaag,2)), type:"training", label:"Training", datum: volgendeDag(vandaag,2) },
  { key: iso(volgendeDag(vandaag,5)), type:"training", label:"Training", datum: volgendeDag(vandaag,5) },
];

if (eerstvolgendeWedstrijd){
  const [y,m,d] = eerstvolgendeWedstrijd.date.split("-").map(Number);
  const [uu,mm] = eerstvolgendeWedstrijd.time.split(":").map(Number);
  const wedstrijdDatum = new Date(y, m-1, d, uu, mm);
  events.push({
    key: eerstvolgendeWedstrijd.date,
    type: "wedstrijd",
    label: eerstvolgendeWedstrijd.home
      ? `Wedstrijd vs ${eerstvolgendeWedstrijd.opponent}`
      : `Uit bij ${eerstvolgendeWedstrijd.opponent}`,
    datum: wedstrijdDatum,
    tijd: eerstvolgendeWedstrijd.time,
    locatie: eerstvolgendeWedstrijd.location,
  });
}

events.sort((a,b) => a.datum - b.datum);

const VASTE_NAMEN = ["Jovana","Moira","Senna","Annabelle","Angelina","Eva","Minne","Esra"];

let data = { children: [], attendance: {} };
const statusEl = document.getElementById('status');
const childInput = document.getElementById('childInput');
const nieuweNaamInput = document.getElementById('nieuweNaamInput');
const eventsEl = document.getElementById('events');

function setStatus(msg){ statusEl.textContent = msg; }

async function createBlob(){
  const res = await fetch(BLOB_API, {
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify(data)
  });
  const loc = res.headers.get("Location");
  const id = loc.split("/").pop();
  return id;
}

async function loadBlob(id){
  const res = await fetch(BLOB_API + "/" + id, {headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("niet gevonden");
  return await res.json();
}

async function saveBlob(){
  await fetch(BLOB_API + "/" + blobId, {
    method:"PUT",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify(data)
  });
}

function renderChildNames(){
  const huidige = childInput.value;
  childInput.innerHTML = "";
  const optKies = document.createElement('option');
  optKies.value = "";
  optKies.textContent = "Kies een naam…";
  childInput.appendChild(optKies);

  data.children.slice().sort((a,b)=>a.localeCompare(b,'nl')).forEach(name=>{
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    childInput.appendChild(opt);
  });

  const optNieuw = document.createElement('option');
  optNieuw.value = "__nieuw__";
  optNieuw.textContent = "+ Andere naam toevoegen";
  childInput.appendChild(optNieuw);

  if ([...childInput.options].some(o => o.value === huidige)) {
    childInput.value = huidige;
  }
}

function getCurrentChild(){
  if (childInput.value === "__nieuw__") return nieuweNaamInput.value.trim();
  return childInput.value;
}

function renderEvents(){
  eventsEl.innerHTML = "";
  const currentChild = getCurrentChild();

  events.forEach(ev=>{
    const box = document.createElement('div');
    box.className = "event" + (ev.type === "wedstrijd" ? " wedstrijd" : "");

    const att = data.attendance[ev.key] || {};

    const komtActive = currentChild && att[currentChild] === true;
    const nietActive = currentChild && att[currentChild] === false;

    const komers = Object.entries(att).filter(([n,v])=>v===true).map(([n])=>n);
    const afmelders = Object.entries(att).filter(([n,v])=>v===false).map(([n])=>n);

    box.innerHTML = `
      <div class="event-head">
        <div class="titel-rij">
          <div>
            <div class="type">${ev.type === "wedstrijd" ? "Wedstrijd" : "Training"}</div>
            <h2>${ev.label}</h2>
          </div>
          <span class="teller">${komers.length}</span>
        </div>
        <div class="datum">${fmt(ev.datum)}${ev.tijd ? " · " + ev.tijd : ""}${ev.locatie ? "<br>" + ev.locatie : ""}</div>
      </div>
      <div class="toggle">
        <button class="komt ${komtActive?'active':''}" ${!currentChild?'disabled':''} data-key="${ev.key}" data-val="true">Komt</button>
        <button class="niet ${nietActive?'active':''}" ${!currentChild?'disabled':''} data-key="${ev.key}" data-val="false">Komt niet</button>
      </div>
      <div class="lijst">
        ${komers.length ? "Komen: " + komers.map(n=>`<span class="naam">${n}</span>`).join(", ") : "Nog niemand aangemeld."}
        ${afmelders.length ? "<br>Afgemeld: " + afmelders.map(n=>`<span class="naam niet">${n}</span>`).join(", ") : ""}
      </div>
    `;

    box.querySelectorAll('.toggle button').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!currentChild) return;
        const key = btn.dataset.key;
        const val = btn.dataset.val === "true";
        if(!data.attendance[key]) data.attendance[key] = {};
        data.attendance[key][currentChild] = val;
        if(!data.children.includes(currentChild)){
          data.children.push(currentChild);
          renderChildNames();
        }
        setStatus("Opslaan…");
        renderEvents();
        try{
          await saveBlob();
          setStatus("Opgeslagen ✓");
        }catch(e){
          setStatus("Opslaan mislukt, probeer opnieuw.");
        }
      });
    });

    eventsEl.appendChild(box);
  });
}

childInput.addEventListener('change', ()=>{
  nieuweNaamInput.style.display = childInput.value === "__nieuw__" ? "block" : "none";
  if (childInput.value === "__nieuw__") nieuweNaamInput.focus();
  renderEvents();
});
nieuweNaamInput.addEventListener('input', renderEvents);

async function init(){
  data.children = [...VASTE_NAMEN];
  try{
    if(blobId){
      setStatus("Laden…");
      const geladen = await loadBlob(blobId);
      if(!geladen.attendance) geladen.attendance = {};
      data.attendance = geladen.attendance;
      data.children = Array.from(new Set([...VASTE_NAMEN, ...(geladen.children||[])]));
    } else {
      setStatus("Nieuwe lijst aanmaken…");
      blobId = await createBlob();
      const shareUrl = location.origin + location.pathname + "?poll=" + blobId;
      const box = document.getElementById('shareBox');
      const link = document.getElementById('shareLink');
      link.href = shareUrl;
      link.textContent = shareUrl;
      box.style.display = "block";
    }
    setStatus("");
  }catch(e){
    setStatus("Let op: niet verbonden met de gedeelde lijst. Open de pagina via de echte link online, anders wordt niets gedeeld met andere ouders.");
  }
  renderChildNames();
  renderEvents();
}

init();
</script>
</body>
</html>
